name: Main build

# Every push to main, nightly and on demand: render the README's screenshot and
# demos, validate and package every platform, collect one downloadable set,
# then commit the refreshed media and README blocks if main has not moved.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# No shared concurrency group: GitHub would otherwise replace pending runs,
# skipping builds when several pushes arrive close together.

env:
  BUILD_NUMBER: ${{ github.run_number }}
  # The table checks compare generated text exactly, so these are the versions
  # that reproduce the committed tables.
  PYTHON_PACKAGES: numpy==2.5.3 scipy==1.18.1 mpmath==1.4.1

jobs:
  # Render into a staging tree holding a copy of the README, so its demo table
  # is rewritten beside the exact audio being published.
  render-audio-demos:
    name: Render the audio demos (audio tier)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Build the renderer and run the audio tier
        run: |
          cmake -S . -B build-dsp -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DMAREMBA_BUILD_PLUGIN=OFF -DBUILD_TESTING=ON
          cmake --build build-dsp --parallel --target RenderMarembaPresetDemos
          ctest --test-dir build-dsp -L '^audio$' --no-tests=error --output-on-failure

      - name: Render the demos
        run: |
          set -euo pipefail
          generated="build-dsp/generated-media"
          mkdir -p "$generated/Docs/audio"
          cp README.md "$generated/README.md"
          ./build-dsp/RenderMarembaPresetDemos --jobs 4 Docs/audio/midi "$generated/Docs/audio"
          python3 Tools/update_readme_blocks.py demos --readme "$generated/README.md" \
            --manifest "$generated/Docs/audio/demos.json"
          ls -l "$generated/Docs/audio"

      # U7: the perf tier's figures for the record, one file per main build.
      - name: Time the demos (perf tier)
        run: |
          ./build-dsp/RenderMarembaPresetDemos --cpu --json build-dsp/cpu.json --note "${GITHUB_SHA}" Docs/audio/midi

      - name: Upload the CPU figures
        uses: actions/upload-artifact@v4
        with:
          name: cpu-maremba-main-build-${{ github.run_number }}
          path: build-dsp/cpu.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload demo audio and README copy
        uses: actions/upload-artifact@v4
        with:
          name: generated-audio-demos
          path: build-dsp/generated-media
          if-no-files-found: error
          retention-days: 30

  build-macos:
    name: macOS universal VST3, AU, CLAP and standalone
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build universal plug-in and run tests
        env:
          BUILD_UNIVERSAL: "ON"
        run: ./scripts/build-macos.sh

      - name: Render the editor screenshot (render tier)
        run: ./build-macos/Release/MarembaEditorSnapshot "${{ github.workspace }}/generated/Docs/screenshots/maremba.png"

      # Uploaded only after the suite passed: a run whose editor assertions
      # failed may still have written a PNG, and publishing it is worse than
      # keeping yesterday's.
      - name: Upload the rendered screenshot
        uses: actions/upload-artifact@v4
        with:
          name: generated-screenshot
          path: generated
          if-no-files-found: error
          retention-days: 30

      - name: Validate the plug-ins (pluginval, clap-validator, auval on macOS)
        shell: bash
        run: ./scripts/validate-plugins.sh build-macos Maremba aumu Mrb1 Mrmb 0x4d524d42

      - name: Package (ad-hoc-signed bundles)
        run: ./scripts/sign-and-package-macos.sh

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: main-build-packages-${{ github.run_number }}-macos
          path: |
            build-macos/dist/Maremba-*-build.${{ github.run_number }}-macOS-universal.zip
            build-macos/dist/Maremba-*-build.${{ github.run_number }}-macOS-universal.pkg
          if-no-files-found: error
          retention-days: 30

  build-linux:
    name: Linux VST3, CLAP and standalone
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JUCE Linux dependencies and the Python check packages
        run: |
          python3 -m pip install --disable-pip-version-check $PYTHON_PACKAGES
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libasound2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            xvfb

      - name: Configure, build and run the unit tier
        run: |
          cmake -S . -B build-plugin -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DMAREMBA_BUILD_PLUGIN=ON -DBUILD_TESTING=ON \
            -DMAREMBA_REQUIRE_PYTHON_TESTS=ON "-DPython3_EXECUTABLE=$(command -v python3)"
          cmake --build build-plugin --parallel
          ctest --test-dir build-plugin -L '^unit$' --no-tests=error --output-on-failure

      - name: Validate the plug-ins (pluginval, clap-validator, auval on macOS)
        shell: bash
        run: ./scripts/validate-plugins.sh build-plugin Maremba aumu Mrb1 Mrmb 0x4d524d42

      - name: Package Linux VST3, CLAP and standalone
        run: python3 scripts/package-linux.py --build-dir build-plugin

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: main-build-packages-${{ github.run_number }}-linux
          path: build-plugin/dist/Maremba-*-build.${{ github.run_number }}-Linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Windows x64 VST3, CLAP and standalone
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure and build
        run: |
          cmake -S . -B build-plugin -A x64 -DMAREMBA_BUILD_PLUGIN=ON -DMAREMBA_BUILD_TOOLS=OFF -DBUILD_TESTING=OFF
          cmake --build build-plugin --config Release --parallel --target Maremba_VST3 Maremba_CLAP Maremba_Standalone

      - name: Validate the plug-ins (pluginval, clap-validator, auval on macOS)
        shell: bash
        run: ./scripts/validate-plugins.sh build-plugin Maremba aumu Mrb1 Mrmb 0x4d524d42

      - name: Package Windows VST3, CLAP and standalone
        run: python scripts/package-windows.py --build-dir build-plugin

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: main-build-packages-${{ github.run_number }}-windows
          path: build-plugin/dist/Maremba-*-build.${{ github.run_number }}-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  long-fuzz:
    name: Long libFuzzer run (fuzz tier)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the harness under ASan + UBSan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build
          cmake -S . -B build-fuzz -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DMAREMBA_BUILD_PLUGIN=OFF -DMAREMBA_BUILD_FUZZER=ON -DBUILD_TESTING=OFF
          cmake --build build-fuzz --parallel --target MarembaDspFuzz

      - name: Fuzz for 30 minutes
        working-directory: build-fuzz
        run: |
          mkdir -p corpus
          ./MarembaDspFuzz -max_total_time=1800 -rss_limit_mb=4096 -print_final_stats=1 corpus

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-reproducers-${{ github.run_number }}
          path: build-fuzz/crash-*
          if-no-files-found: ignore
          retention-days: 30

  # The standard's full parameter-extremes matrix: every case at all nine
  # rates and block sizes, about 12 CPU-hours, split across eight runners.
  parameter-matrix:
    name: Parameter-extremes matrix, shard ${{ matrix.shard }}/8 (fuzz tier)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the matrix
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build
          cmake -S . -B build-dsp -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DMAREMBA_BUILD_PLUGIN=OFF -DBUILD_TESTING=ON
          cmake --build build-dsp --parallel --target MarembaParameterMatrix

      - name: Run every case of shard ${{ matrix.shard }} at every configuration
        run: ./build-dsp/MarembaParameterMatrix --jobs "$(nproc)" --shard ${{ matrix.shard }}/8

  collect:
    name: Collect maremba-main-build-${{ github.run_number }}
    needs: [render-audio-demos, build-macos, build-linux, build-windows]
    runs-on: ubuntu-24.04
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - name: Download every package
        uses: actions/download-artifact@v4
        with:
          pattern: main-build-packages-${{ github.run_number }}-*
          merge-multiple: true
          path: dist

      - name: Check the package set
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(dist/Maremba-*-build."${BUILD_NUMBER}"-*)
          printf 'Package: %s\n' "${packages[@]}"
          for suffix in macOS-universal.zip macOS-universal.pkg Linux-x64.tar.gz Windows-x64.zip; do
            matches=(dist/Maremba-*-build."${BUILD_NUMBER}"-"$suffix")
            if (( ${#matches[@]} != 1 )) || [[ ! -s "${matches[0]}" ]]; then
              echo "error: expected one non-empty *-$suffix package" >&2
              exit 1
            fi
          done
          versions="$(printf '%s\n' "${packages[@]##*/}" | sed -E 's/^Maremba-([0-9.]+)-build\..*/\1/' | sort -u)"
          if (( ${#packages[@]} != 4 )) || [[ "$(wc -l <<<"$versions")" != 1 ]]; then
            echo "error: expected four packages of one version" >&2
            exit 1
          fi

      - name: Write BUILD.txt and SHA256SUMS
        working-directory: dist
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          printf 'Repository: %s\nCommit: %s\nBuild number: %s\nRun: %s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$BUILD_NUMBER" "$RUN_URL" > BUILD.txt
          sha256sum Maremba-* BUILD.txt > SHA256SUMS

      - name: Upload maremba-main-build-${{ github.run_number }}
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: maremba-main-build-${{ github.run_number }}
          path: dist
          if-no-files-found: error
          retention-days: 30

  commit-generated-assets:
    name: Commit screenshot, demos and README blocks
    if: github.ref == 'refs/heads/main'
    needs: collect
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download rendered audio and README copy
        uses: actions/download-artifact@v4
        with:
          name: generated-audio-demos
          path: generated-media

      - name: Download rendered screenshot
        uses: actions/download-artifact@v4
        with:
          name: generated-screenshot
          path: generated-media

      - name: Commit refreshed media if main still matches this build
        env:
          GH_TOKEN: ${{ github.token }}
          DISTRIBUTION_URL: ${{ needs.collect.outputs.artifact-url }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          ./scripts/commit-generated-assets.sh "$GITHUB_SHA" generated-media "$remote" \
            "$DISTRIBUTION_URL" "$BUILD_NUMBER"
